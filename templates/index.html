<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Daily Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="dashboard-grid">
        <section class="tile tile-half">
            <h2 class="tile-header">🕒 Datum & Uhrzeit</h2>
            <div class="tile-body"
                 hx-get="/tile/time" 
                 hx-trigger="load, every 10s">
                <div class="subtitle">Lade Zeit...</div>
            </div>
        </section>

        <section class="tile tile-half">
            <h2 class="tile-header">⛅ Aktuelles Wetter</h2>
            <div class="tile-body"
                 hx-get="/tile/weather" 
                 hx-trigger="load, every 15m">
                <div class="subtitle">Lade Wetter...</div>
            </div>
        </section>

        <section class="tile tile-half">
            <h2 class="tile-header">📅 Termine (Nächste 5 Tage)</h2>
            <div class="tile-body"
                 hx-get="/tile/calendar" 
                 hx-trigger="load, every 5m">
                <div class="subtitle">Lade Termine...</div>
            </div>
        </section>

        <div class="dashboard-column tile-half">
            <div hx-get="/tile/waste" 
                 hx-trigger="load, every 5m">
            </div>

            <div hx-get="/tile/medication" 
                 hx-trigger="load, every 1m">
            </div>
        </div>

        <div class="bottom-row">
            <div hx-get="/tile/emergency" 
                 hx-trigger="load">
            </div>

            <div hx-get="/tile/signal" 
                 hx-trigger="load, every 5s">
            </div>
        </div>
    </main>

</body>
</html>
